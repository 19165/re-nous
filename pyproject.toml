[project]
name = "multi-agent-research-assistant"
version = "1.0.0"
description = "Enterprise-grade Multi-Agent Research Assistant powered by LangGraph, Ollama, Tavily, Redis, PostgreSQL, and FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-ollama",
    "langchain-core",
    "langchain-community",
    "pydantic",
    "python-dotenv",
    "langchain-tavily",
    "rich",
    "tiktoken",
    "redis",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
